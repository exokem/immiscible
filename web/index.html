<!DOCTYPE html>
<html>

<head>
	<base href="$FLUTTER_BASE_HREF">

	<meta charset="UTF-8">
	<meta content="IE=Edge" http-equiv="X-UA-Compatible">
	<meta name="description" content="A new Flutter project.">

	<!-- iOS meta tags & icons -->
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="apple-mobile-web-app-title" content="bottles">
	<link rel="apple-touch-icon" href="icons/Icon-192.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<!-- Favicon -->
	<link rel="icon" type="image/png" href="favicon.png" />

	<title>Immiscible</title>
	<link rel="manifest" href="manifest.json">
	<style>
		body, html {
			height: 100%;
			width: 100%;
			margin: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			font-family: Arial, sans-serif;
			background-color: #f0f0f0;
		}

		#loading-screen {
			z-index: 9999;
			position: absolute;
			display: flex;
			justify-content: center;
			align-items: center;
			top: 0;
			left: 0;
			height: 100%;
			width: 100%;
			background-color: #3b444c;
			text-align: center;
			display: flex;
			flex-flow: column;
			justify-content: center;
		}

		#loading-status {
			font-size: 1rem;
			color: goldenrod;
			position: absolute;
			margin: 0;
			bottom: 1rem;
			left: 0;
			display: flex;
			width: 100%;
			justify-content: center;
			align-items: center;
			font-family: monospace;
		}

		#spinner {
			border: 5px solid #f3f3f3;
			border-top: 5px solid #3498db;
			border-radius: 50%;
			width: 25%;
			aspect-ratio: 1 / 1;
			animation: spin 1s linear infinite;
			margin: 0px auto;
		}

		.hidden {
			display: none !important;
		}

		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		#bar-container {
			position: relative;
			width: 25vw;
			aspect-ratio: 3 / 6;
			display: flex;
			flex-direction: row;
			place-items: end;
			overflow: clip;
			border-radius: 1rem;
			outline: 0.2rem solid goldenrod;
			outline-offset: 0.5rem;
		}
		
		#progress-bar {
			overflow: clip;
			position: relative;
			width: 100%;
			height: 0;
			background-color: red;
			transition: transform 400ms ease-in-out;
			transition-property: height;
		}

		#loading-percent, #loading-percent-overlay {
			position: absolute;
			display: flex;
			justify-content: center;
			align-items: center;
			width: 100%;
			height: 100%;
			margin: 0;
			font-weight: bold;
			font-family: monospace;
		}

		#loading-percent {
			color: goldenrod;
		}

		#loading-percent-overlay {
			color: #3b444c;
			background-color: goldenrod;
			clip-path: inset(100% 100% 100% 0%);
		}
	</style>
</head>
<body>
	<div id="loading-screen">
		<div id="bar-container">
			<p id="loading-percent"></p>
			<div id="progress-bar"></div>
			<p id="loading-percent-overlay"></p>

		</div>
		<p id="loading-status"></p>
	</div>
</body>

<script src="flutter_bootstrap.js" defer></script>

</html>
